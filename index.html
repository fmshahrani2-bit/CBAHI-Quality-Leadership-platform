const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));const KEY='ara-access-key';
async function derive(pw){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:u(D.s),iterations:D.n,hash:'SHA-256'},base,256))}
async function open(raw){const k=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.i)},k,u(D.d));const html=new TextDecoder().decode(plain);document.open();document.write(html);document.close()}
const hex=a=>[...a].map(b=>b.toString(16).padStart(2,'0')).join(''),unhex=h=>new Uint8Array(h.match(/../g).map(x=>parseInt(x,16)));
(async()=>{let saved=null;try{saved=localStorage.getItem(KEY)||sessionStorage.getItem(KEY)}catch{}if(saved){try{await open(unhex(saved));return}catch{try{localStorage.removeItem(KEY);sessionStorage.removeItem(KEY)}catch{}}}})();
document.getElementById('f').onsubmit=async e=>{e.preventDefault();const b=document.getElementById('go'),er=document.getElementById('err');b.disabled=true;b.textContent='Checking…';er.textContent='';
try{const raw=await derive(document.getElementById('pw').value);await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']).then(k=>crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.i)},k,u(D.d)));
try{(document.getElementById('rm').checked?localStorage:sessionStorage).setItem(KEY,hex(raw))}catch{}await open(raw)}
catch{er.textContent='Incorrect password. Please try again.';b.disabled=false;b.textContent='Enter';document.getElementById('pw').select()}};
</script></body></html>
